name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run checks
        run: npm run check
      - name: Smoke-test server startup
        shell: bash
        run: |
          set -euo pipefail
          node server.js >server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ >root.json; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 0.5
          done
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("root.json","utf8")); if(x.version!=="0.3.0" || x.mcp!=="/mcp") process.exit(1)'
