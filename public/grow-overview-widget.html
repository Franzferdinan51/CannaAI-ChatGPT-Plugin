<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CannaAI Grow Overview</title><style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;padding:14px;background:transparent}.shell{border:1px solid color-mix(in srgb,currentColor 14%,transparent);border-radius:20px;padding:16px;background:color-mix(in srgb,Canvas 95%,transparent);box-shadow:0 14px 40px color-mix(in srgb,#000 10%,transparent)}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.58}h1{margin:4px 0 2px;font-size:21px}.sub{font-size:13px;opacity:.66}.pill{padding:6px 9px;border-radius:999px;background:color-mix(in srgb,#2f7d44 16%,transparent);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.stat,.panel{border-radius:14px;background:color-mix(in srgb,currentColor 6%,transparent);padding:11px}.stat .k{font-size:11px;opacity:.58}.stat .v{font-size:20px;font-weight:700;margin-top:3px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;margin-top:10px}.panel h2{font-size:13px;margin:0 0 9px}.room{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid color-mix(in srgb,currentColor 9%,transparent)}.room:first-of-type{border-top:0}.room .meta{font-size:12px;opacity:.65}.warn{font-size:13px;line-height:1.4}.empty{font-size:13px;opacity:.6;padding:8px 0}button{margin-top:12px;border:0;border-radius:11px;padding:9px 12px;font:inherit;cursor:pointer;background:#2f7d44;color:white}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><div class="top"><div><div class="eyebrow">CannaAI</div><h1>Grow overview</h1><div class="sub" id="subtitle">Waiting for backend data…</div></div><div class="pill">Read only</div></div><section class="stats" id="stats"></section><section class="grid"><div class="panel"><h2>Rooms</h2><div id="rooms" class="empty">No rooms loaded.</div></div><div><div class="panel"><h2>Active alerts</h2><div id="alerts" class="empty">Unavailable.</div></div><div class="panel" style="margin-top:10px"><h2>Predictive insight</h2><div id="insight" class="empty">Unavailable.</div></div><div class="panel" style="margin-top:10px"><h2>Inventory</h2><div id="inventory" class="empty">Unavailable.</div></div></div></section><button id="ask">Ask ChatGPT about this grow</button></main><script type="module">
let rpcId=0;const pending=new Map();let state={overview:null};const $=id=>document.getElementById(id);function req(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}async function init(){await req('ui/initialize',{appInfo:{name:'cannaai-grow-overview',version:'0.5.0'},appCapabilities:{},protocolVersion:'2026-01-26'});notify('ui/notifications/initialized',{})}window.addEventListener('message',e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result')absorb(m.params?.structuredContent??m.params)},{passive:true});function absorb(data){if(data?.overview)state.overview=data.overview;render()}function card(k,v){const n=document.createElement('div');n.className='stat';const a=document.createElement('div');a.className='k';a.textContent=k;const b=document.createElement('div');b.className='v';b.textContent=v;n.append(a,b);return n}function render(){const o=state.overview;if(!o)return;const rooms=Array.isArray(o.rooms)?o.rooms:[];const plants=Array.isArray(o.plants)?o.plants:[];const alerts=o.alertSummary;const inv=o.inventory;$('subtitle').textContent=`${plants.length} plants across ${rooms.length} rooms`;const stats=[card('Plants',plants.length),card('Rooms',rooms.length),card('Unacknowledged',alerts?.unacknowledged??'—'),card('Low stock',inv?.statistics?.lowStockCount??'—')];$('stats').replaceChildren(...stats);if(rooms.length){const nodes=rooms.map(r=>{const row=document.createElement('div');row.className='room';const left=document.createElement('div');const name=document.createElement('strong');name.textContent=r.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${r.temperatureF??'—'}°F · ${r.humidityPct??'—'}% RH · ${r.co2Ppm??'—'} ppm CO₂`;left.append(name,meta);const count=document.createElement('div');count.textContent=`${plants.filter(p=>p.roomId===r.id).length} plants`;row.append(left,count);return row});$('rooms').replaceChildren(...nodes)}$('alerts').className=alerts?'warn':'empty';$('alerts').textContent=alerts?`${alerts.unacknowledged} unacknowledged of ${alerts.total} visible alerts.`:'Alert data unavailable.';$('insight').className=o.aiInsights?'warn':'empty';$('insight').textContent=o.aiInsights?.coPilotResponse||o.aiInsights?.summary||'Predictive insights unavailable.';$('inventory').className=inv?'warn':'empty';$('inventory').textContent=inv?`${inv.statistics.totalItems} items · ${inv.statistics.lowStockCount} low stock${inv.source==='cannaai-backend'?' · backend reported':''}.`:'Inventory unavailable.'}async function followUp(prompt){if(window.openai?.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt});return req('ui/message',{role:'user',content:[{type:'text',text:prompt}]})}$('ask').onclick=()=>followUp('Review the CannaAI grow overview shown here. Prioritize anything that needs attention and explain what you would inspect next.');init().catch(console.error);render();
</script></body></html>
