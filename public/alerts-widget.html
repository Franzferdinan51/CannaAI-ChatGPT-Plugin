<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CannaAI Alerts</title><style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;padding:14px}.shell{border:1px solid color-mix(in srgb,currentColor 14%,transparent);border-radius:20px;padding:16px;background:color-mix(in srgb,Canvas 95%,transparent)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}h1{font-size:20px;margin:3px 0}.sub{font-size:12px;opacity:.62}.count{font-size:12px;padding:6px 9px;border-radius:999px;background:color-mix(in srgb,#d97706 15%,transparent)}.alerts{display:grid;gap:8px;margin-top:13px}.alert{border-radius:13px;padding:11px;background:color-mix(in srgb,currentColor 6%,transparent);border-left:4px solid color-mix(in srgb,currentColor 25%,transparent)}.alert.critical{border-left-color:#dc2626}.alert.high{border-left-color:#ea580c}.alert.warning{border-left-color:#d97706}.alert.info{border-left-color:#2563eb}.head{display:flex;justify-content:space-between;gap:8px}.sev{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.msg{font-size:13px;margin-top:5px;line-height:1.4}.meta{font-size:11px;opacity:.58;margin-top:5px}.empty{padding:22px;text-align:center;opacity:.62}button{margin-top:12px;border:0;border-radius:11px;padding:9px 12px;background:#2f7d44;color:white;font:inherit;cursor:pointer}
</style></head><body><main class="shell"><div class="top"><div><div class="sub">CannaAI · Read only</div><h1>Alerts</h1></div><div id="count" class="count">—</div></div><div class="alerts" id="alerts"><div class="empty">Waiting for alert data…</div></div><button id="ask">Ask ChatGPT to prioritize these alerts</button></main><script type="module">
let rpcId=0;const pending=new Map();let state={alerts:[],summary:null};const $=id=>document.getElementById(id);function req(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}async function init(){await req('ui/initialize',{appInfo:{name:'cannaai-alerts',version:'0.5.0'},appCapabilities:{},protocolVersion:'2026-01-26'});notify('ui/notifications/initialized',{})}window.addEventListener('message',e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result'){const d=m.params?.structuredContent??m.params;if(d){state.alerts=Array.isArray(d.alerts)?d.alerts:state.alerts;state.summary=d.summary??state.summary;render()}}},{passive:true});function render(){const s=state.summary;$('count').textContent=s?`${s.unacknowledged} unack / ${s.total} total`:`${state.alerts.length} alerts`;if(!state.alerts.length){const e=document.createElement('div');e.className='empty';e.textContent='No matching alerts.';$('alerts').replaceChildren(e);return}const nodes=state.alerts.map(a=>{const n=document.createElement('div');n.className=`alert ${a.severity||'other'}`;const head=document.createElement('div');head.className='head';const sev=document.createElement('div');sev.className='sev';sev.textContent=a.severity||'other';const ack=document.createElement('div');ack.className='sub';ack.textContent=a.acknowledged?'Acknowledged':'Unacknowledged';head.append(sev,ack);const msg=document.createElement('div');msg.className='msg';msg.textContent=a.message||a.type;const meta=document.createElement('div');meta.className='meta';meta.textContent=[a.type,a.sensorId,a.createdAt].filter(Boolean).join(' · ');n.append(head,msg,meta);return n});$('alerts').replaceChildren(...nodes)}async function followUp(prompt){if(window.openai?.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt});return req('ui/message',{role:'user',content:[{type:'text',text:prompt}]})}$('ask').onclick=()=>followUp('Prioritize the CannaAI alerts shown here. Tell me which ones need attention first, why, and what read-only data you would check before changing anything.');init().catch(console.error);render();
</script></body></html>
