<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CannaAI Plant Analysis</title><style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;padding:14px}.shell{border:1px solid color-mix(in srgb,currentColor 14%,transparent);border-radius:20px;padding:16px;background:color-mix(in srgb,Canvas 95%,transparent)}.top{display:flex;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;opacity:.58;text-transform:uppercase;letter-spacing:.09em}h1{font-size:20px;margin:3px 0}.badge{font-size:11px;padding:6px 9px;border-radius:999px;background:color-mix(in srgb,#2f7d44 15%,transparent);height:max-content}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.stat,.panel{background:color-mix(in srgb,currentColor 6%,transparent);border-radius:13px;padding:11px}.k{font-size:10px;text-transform:uppercase;opacity:.58}.v{font-size:18px;font-weight:700;margin-top:3px}.panel{margin-top:9px}.panel h2{font-size:12px;margin:0 0 7px}.diagnosis{font-size:15px;font-weight:700}.rec{font-size:13px;line-height:1.45;margin:5px 0}.meta{font-size:11px;opacity:.6}.issues{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:color-mix(in srgb,currentColor 8%,transparent)}.empty{font-size:13px;opacity:.6}button{margin-top:12px;border:0;border-radius:11px;padding:9px 12px;background:#2f7d44;color:white;font:inherit;cursor:pointer}@media(max-width:520px){.stats{grid-template-columns:1fr}}
</style></head><body><main class="shell"><div class="top"><div><div class="eyebrow">Stored CannaAI analysis</div><h1 id="title">Plant analysis</h1></div><div class="badge">Backend sourced</div></div><div class="stats" id="stats"></div><div class="panel"><h2>Latest diagnosis</h2><div id="latest" class="empty">No stored analysis loaded.</div></div><div class="panel"><h2>Recommendations</h2><div id="recs" class="empty">No recommendations available.</div></div><div class="panel"><h2>Top issues</h2><div id="issues" class="issues"><span class="empty">No issue data.</span></div></div><button id="ask">Ask ChatGPT to interpret this analysis</button></main><script type="module">
let rpcId=0;const pending=new Map();let state={plant:null,analyses:[],analytics:null};const $=id=>document.getElementById(id);function req(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}async function init(){await req('ui/initialize',{appInfo:{name:'cannaai-analysis',version:'0.5.0'},appCapabilities:{},protocolVersion:'2026-01-26'});notify('ui/notifications/initialized',{})}window.addEventListener('message',e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result'){const d=m.params?.structuredContent??m.params;if(d){state.plant=d.plant??state.plant;state.analyses=Array.isArray(d.analyses)?d.analyses:state.analyses;state.analytics=d.analytics??state.analytics;render()}}},{passive:true});function stat(k,v){const n=document.createElement('div');n.className='stat';const a=document.createElement('div');a.className='k';a.textContent=k;const b=document.createElement('div');b.className='v';b.textContent=v;n.append(a,b);return n}function render(){const latest=state.analyses[0]??null;const sum=state.analytics?.summary;$('title').textContent=state.plant?.name?`${state.plant.name} analysis`:'Plant analysis';$('stats').replaceChildren(stat('Health score',latest?.healthScore??sum?.avgHealthScore??'—'),stat('Confidence',latest?.confidence==null?'—':`${Math.round(latest.confidence<=1?latest.confidence*100:latest.confidence)}%`),stat('Stored analyses',sum?.totalAnalyses??state.analyses.length));if(latest){const wrap=document.createElement('div');const d=document.createElement('div');d.className='diagnosis';d.textContent=latest.diagnosis||'Unknown';const m=document.createElement('div');m.className='meta';m.textContent=[latest.provider,latest.createdAt,latest.urgency].filter(Boolean).join(' · ');wrap.append(d,m);$('latest').className='';$('latest').replaceChildren(wrap);const recs=Array.isArray(latest.recommendations)?latest.recommendations:[];$('recs').className=recs.length?'':'empty';$('recs').replaceChildren(...(recs.length?recs.map(x=>{const n=document.createElement('div');n.className='rec';n.textContent=`• ${x}`;return n}):[document.createTextNode('No recommendations available.')]))}const issues=Array.isArray(state.analytics?.topIssues)?state.analytics.topIssues:[];$('issues').replaceChildren(...(issues.length?issues.map(i=>{const n=document.createElement('span');n.className='chip';n.textContent=`${i.issue} · ${i.count}`;return n}):[Object.assign(document.createElement('span'),{className:'empty',textContent:'No issue data.'})]))}async function followUp(prompt){if(window.openai?.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt});return req('ui/message',{role:'user',content:[{type:'text',text:prompt}]})}$('ask').onclick=()=>followUp(`Interpret the stored CannaAI analysis shown for ${state.plant?.name??'this plant'}. Separate what CannaAI reported from your own synthesis and tell me what deserves follow-up.`);init().catch(console.error);render();
</script></body></html>
