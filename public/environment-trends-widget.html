<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CannaAI Environment Trends</title><style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;padding:14px}.shell{border:1px solid color-mix(in srgb,currentColor 14%,transparent);border-radius:20px;padding:16px;background:color-mix(in srgb,Canvas 95%,transparent)}h1{font-size:20px;margin:3px 0}.sub{font-size:12px;opacity:.62}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:13px 0}.metric,.chart{background:color-mix(in srgb,currentColor 6%,transparent);border-radius:13px;padding:10px}.k{font-size:10px;opacity:.58;text-transform:uppercase}.v{font-weight:700;font-size:16px;margin-top:3px}.charts{display:grid;gap:9px}.chart h2{font-size:12px;margin:0 0 6px}.chart svg{width:100%;height:90px;display:block}.empty{font-size:13px;opacity:.6;padding:16px}.line{fill:none;stroke:currentColor;stroke-width:2}.gridline{stroke:currentColor;stroke-opacity:.09;stroke-width:1}button{margin-top:12px;border:0;border-radius:11px;padding:9px 12px;background:#2f7d44;color:white;font:inherit;cursor:pointer}@media(max-width:640px){.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell"><div class="sub">CannaAI · Read-only sensor history</div><h1 id="title">Environment trends</h1><div class="sub" id="range">Waiting for readings…</div><div class="metrics" id="metrics"></div><div class="charts" id="charts"></div><button id="ask">Ask ChatGPT about these trends</button></main><script type="module">
let rpcId=0;const pending=new Map();let state={room:null,readings:[]};const $=id=>document.getElementById(id);function req(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}async function init(){await req('ui/initialize',{appInfo:{name:'cannaai-environment-trends',version:'0.5.0'},appCapabilities:{},protocolVersion:'2026-01-26'});notify('ui/notifications/initialized',{})}window.addEventListener('message',e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result'){const d=m.params?.structuredContent??m.params;if(d){state.room=d.room??state.room;state.readings=Array.isArray(d.readings)?d.readings:state.readings;render()}}},{passive:true});function finiteValues(rows,key){return rows.map(r=>Number(r?.[key])).filter(Number.isFinite)}function avg(rows,key){const values=finiteValues(rows,key);return values.length?values.reduce((a,b)=>a+b,0)/values.length:null}function metric(k,v){const n=document.createElement('div');n.className='metric';n.innerHTML='';const a=document.createElement('div');a.className='k';a.textContent=k;const b=document.createElement('div');b.className='v';b.textContent=v;n.append(a,b);return n}function chart(title,key){const box=document.createElement('div');box.className='chart';const h=document.createElement('h2');h.textContent=title;box.append(h);const values=finiteValues(state.readings,key);if(!values.length){const e=document.createElement('div');e.className='empty';e.textContent='No finite values for this metric.';box.append(e);return box}const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 600 90');for(const y of [20,45,70]){const g=document.createElementNS(svg.namespaceURI,'line');g.setAttribute('x1','0');g.setAttribute('x2','600');g.setAttribute('y1',String(y));g.setAttribute('y2',String(y));g.setAttribute('class','gridline');svg.append(g)}const min=Math.min(...values),max=Math.max(...values),span=max-min||1;const points=state.readings.map((r,i)=>{const v=Number(r?.[key]);if(!Number.isFinite(v))return null;const x=state.readings.length===1?300:i/(state.readings.length-1)*600;const y=78-(v-min)/span*66;return `${x.toFixed(1)},${y.toFixed(1)}`}).filter(Boolean);if(points.length){const line=document.createElementNS(svg.namespaceURI,'polyline');line.setAttribute('points',points.join(' '));line.setAttribute('class','line');svg.append(line)}box.append(svg);return box}function val(v,s=''){return v===null?'—':`${Math.round(v*10)/10}${s}`}function render(){const r=state.readings;$('title').textContent=state.room?.name?`${state.room.name} trends`:'Environment trends';$('range').textContent=r.length?`${r.length} readings · ${r[0]?.timestamp??'unknown'} → ${r.at(-1)?.timestamp??'unknown'}`:'No environment history available.';$('metrics').replaceChildren(metric('Avg temp',val(avg(r,'temperatureF'),'°F')),metric('Avg RH',val(avg(r,'humidityPct'),'%')),metric('Avg VPD',val(avg(r,'vpdKpa'),' kPa')),metric('Avg CO₂',val(avg(r,'co2Ppm'),' ppm')),metric('Avg light',val(avg(r,'light'))));$('charts').replaceChildren(chart('Temperature °F','temperatureF'),chart('Relative humidity %','humidityPct'),chart('VPD kPa','vpdKpa'))}async function followUp(prompt){if(window.openai?.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt});return req('ui/message',{role:'user',content:[{type:'text',text:prompt}]})}$('ask').onclick=()=>followUp(`Analyze the CannaAI environment trends shown for ${state.room?.name??'this room'}. Explain what stands out and what I should watch next.`);init().catch(console.error);render();
</script></body></html>
